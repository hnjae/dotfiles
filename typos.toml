#:schema https://cdn.jsdelivr.net/gh/crate-ci/typos@master/config.schema.json

[default]
locale = "en"
extend-ignore-re = [
  "alias.*",
]

[default.extend-words]
CPY = "CPY"
nd = "nd"

[files]
ignore-dot = false
extend-exclude = [
  # Submodules
  "lib/dotbot/",
  "**/xdg-data-home/zimfw",
  "**/mpv/script-repos",
  "**/mpv/shaders-repo",
  "**/zsh/modules/**/module",
  "**/.agents/skills-repos",

  # Managed by own typos.toml
  "**/xdg-config-home/nvim",

  # Unmanaged
  "*.cheat",
  "**/cheat/cheatsheets",
  "**/xdg-config-home/fontconfig",
  "**/xdg-config-home/k*",
  "**/xdg-config-home/lazygit",
  "**/xdg-config-home/**/themes/**/*.ini",
  "**/xdg-data-home/kxmlgui5",
]

[type.zsh]
extend-ignore-re = [
  "alias.*",
]

[type.zsh.extend-words]
"ot" = "ot"
"Pn" = "Pn"
