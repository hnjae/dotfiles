---
- defaults:
    link:
      create: true
      relink: true
      force: true
- link:
    ~/.ssh:
      glob: true
      path: home+.ssh/*
    ~/.config:
      glob: true
      path: xdg-config-home/*
    ~/.local/bin:
      glob: true
      path: xdg-bin-home/*
    ~/.var/app/io.mpv.Mpv/config/mpv:
      path: ~/.config/mpv
- shell:
    - description: Configure removed MIME associations
      command: _install/mimeapps/configure_removed_associations.py
