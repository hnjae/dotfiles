<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- NOTE: Nerd Font 에서는 Mono 가 없으면 아이콘이 1.5 배 큼 (이름에 Mono 가 없지만 Monospace 임) --><fontconfig>
  <!-- NOTE: https://www.w3.org/TR/css-fonts-4 -->
  <description>Generic CSS fonts</description>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer>
      <!-- <family>Sarasa UI J</family> -->
      <!-- <family>Sarasa UI K</family> -->
      <family>Pretendard JP</family>
      <family>Pretendard</family>
      <family>Plangothic P1</family>
      <family>Plangothic P2</family>
    </prefer>
  </alias>
</fontconfig>
