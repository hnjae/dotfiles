<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- NOTE: Nerd Font 에서는 Mono 가 없으면 아이콘이 1.5 배 큼 (이름에 Mono 가 없지만 Monospace 임) --><fontconfig>
  <description>Generic fonts</description>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <!-- <family>Sarasa Mono J</family> -->
      <!-- <family>Sarasa Mono K</family> -->
      <family>0xProto</family>
      <family>Plangothic P1</family>
      <family>Plangothic P2</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <!-- <family>Noto Sans CJK JP</family> -->
      <!-- <family>Noto Sans CJK KR</family> -->
      <family>Sarasa Gothic J</family>
      <family>Sarasa Gothic K</family>
      <!-- Plangothic: 중국 자형 sans-serif font -->
      <family>Plangothic P1</family>
      <family>Plangothic P2</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK KR</family>
      <!-- Jigmo: 일본 자형 serif font -->
      <family>Jigmo</family>
      <family>Jigmo2</family>
      <family>Jigmo3</family>
    </prefer>
  </alias>
  <!-- NOTE: https://www.w3.org/TR/css-fonts-4 -->
  <alias binding="strong">
    <family>system-ui</family>
    <prefer>
      <!-- <family>Sarasa UI J</family> -->
      <!-- <family>Sarasa UI K</family> -->
      <family>Pretendard JP</family>
      <family>Pretendard</family>
      <family>Plangothic P1</family>
      <family>Plangothic P2</family>
    </prefer>
  </alias>
  <!-- ADD emoji/math -->
</fontconfig>
