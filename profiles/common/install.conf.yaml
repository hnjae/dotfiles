---
- defaults:
    link:
      create: true
      relink: true
      force: true
- clean:
    - '~'
    - ~/.config
    - ~/.local/share
- link:
    ~/:
      glob: true
      path: home/.*
    ~/.config:
      glob: true
      path: xdg-config-home/*
    ~/.local/share:
      glob: true
      path: xdg-data-home/*
    ~/.local/bin:
      glob: true
      path: xdg-bin-home/*
    ~/.zshenv:
      path: ~/.config/zsh/.zshenv
    ~/.ssh:
      glob: true
      path: home_.ssh/*
    ~/Projects:
      glob: true
      path: home_Projects/*
    # xdg-config-home@merge:
    ~/.config/codex/AGENTS.md: xdg-config-home@merge/codex/AGENTS.md
    ~/.config/codex/rules: xdg-config-home@merge/codex/rules
    ~/.config/codex/skills: xdg-config-home@merge/codex/skills
    ~/.claude/settings.json: xdg-config-home@merge/claude/settings.json
    ~/.claude/skills: xdg-config-home@merge/claude/skills
    ~/.claude/CLAUDE.md: xdg-config-home@merge/claude/CLAUDE.md
    ~/.omp/agent/AGENTS.md: xdg-config-home@merge/omp/agent/AGENTS.md
    ~/.omp/agent/config.yml: xdg-config-home@merge/omp/agent/config.yml
    ~/.omp/agent/mcp.json: xdg-config-home@merge/omp/agent/mcp.json
    ~/.omp/plugins: xdg-config-home@merge/omp/plugins
    ~/.pi/agent/npm/package.json: xdg-config-home@merge/pi/agent/npm/package.json
    ~/.pi/agent/mcp.json: xdg-config-home@merge/pi/agent/mcp.json
    ~/.pi/agent/settings.json: xdg-config-home@merge/pi/agent/settings.json
    ~/.pi/agent/extensions: xdg-config-home@merge/pi/agent/extensions
- shell:
    - description: Installing submodules
      command: git submodule update --init --recursive
    - description: Install/Restore neovim plugins
      command: install.d/restore-neovim-plugins.sh
    - description: Install Mason tools
      command: install.d/install-mason-tools.sh
    - description: Install/Update treesitter parsers
      command: install.d/install-treesitter-parsers.sh
    - description: seed files
      command: install.d/seed-files.sh
