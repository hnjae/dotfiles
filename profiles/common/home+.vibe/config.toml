vim_keybindings = true

theme = "mistral-dark"

active_model = "zai-glm-5-3-flash"

applied_migrations = ["bash_read_only_defaults_v1"]

[[models]]
thinking = "high"
alias = "zai-glm-5-3-flash"

# sensitive pattern lists mirror maki's secrets_guard.lua (which mirrors
# cc-safety-net's secret rules) plus the user AGENTS.md secret list.
# The same list is repeated across the four tool tables below; keep in sync.
# Glob match is right-anchored, case-insensitive; a leading-/ pattern is
# matched in full against the absolute path.
[tools.bash]
allowlist = [
  "agent-browser",
  "basename",
  "cat",
  "cd",
  "chmod",
  "comm",
  "cp",
  "cut",
  "date",
  "diff",
  "dirname",
  "du",
  "echo",
  "file",
  "find",
  "fmt",
  "fold",
  "git diff",
  "git log",
  "git rev-parse --git-dir <redirect>",
  "git status",
  "grep",
  "head",
  "join",
  "jq",
  "less",
  "ls",
  "md5sum",
  "more",
  "nl",
  "node",
  "od",
  "paste",
  "pwd",
  "python3",
  "readlink",
  "sed",
  "sha1sum",
  "sha256sum",
  "shasum",
  "sort",
  "stat",
  "sum",
  "tac",
  "tail",
  "tr",
  "tree",
  "uname",
  "uniq",
  "vibe",
  "wc",
  "which",
  "whoami",
  "rg",
  "awk",
  "df",
  "free",
  "git show",
  "git branch",
  "git remote",
]
sensitive_file_patterns = [
  "**/.env",
  "**/.env.*",
  "**/.env~",
  "**/.envrc",
  "**/.envrc.*",
  "**/.envrc~",
  "**/.ssh",
  "**/.ssh/**",
  "**/id_rsa",
  "**/id_ed25519",
  "**/id_ecdsa",
  "**/.aws",
  "**/.aws/**",
  "**/.kube",
  "**/.kube/**",
  "**/.docker",
  "**/.docker/**",
  "**/.config/gh",
  "**/.config/gh/**",
  "**/.config/gcloud",
  "**/.config/gcloud/**",
  "**/.gcp",
  "**/.gcp/**",
  "**/.cloudflared",
  "**/.cloudflared/**",
  "**/.config/sops",
  "**/.config/sops/**",
  "**/keyrings",
  "**/keyrings/**",
  "**/.password-store",
  "**/.password-store/**",
  "**/auth.json",
  "**/.credentials.json",
  "**/oauth_creds.json",
  "**/.npmrc",
  "**/.netrc",
  "**/.git-credentials",
  "**/credentials",
  "**/*.kdbx",
  "**/*.key",
  "**/*.keystore",
  "**/*.pem",
  "**/*.p12",
  "**/.bash_history",
  "**/.zsh_history",
  "**/zsh_history",
  "**/.histfile",
  "**/.history",
  "**/fish_history",
  "**/psql_history",
  "**/.psql_history",
  "**/python_history",
  "**/.python_history",
  "**/.sqlite_history",
  "**/.node_repl_history",
  "**/.irb_history",
  "**/shell.history.json",
  "**/history.jsonl",
  "**/bash/history",
  "**/zsh/history",
]

