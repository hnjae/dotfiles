model = "zai-glm-5-3-flash"
model_provider = "mistral"
web_search = "disabled"
model_catalog_json = "~/.codex/model-catalogs/mistral.json"
model_reasoning_effort = "high"

[model_providers.mistral]
name = "Mistral La Plateforme"
base_url = "https://api.mistral.ai/v1"
env_key = "MISTRAL_API_KEY"
wire_api = "responses"

[tui]
screen_reader_detection_done = true

[features]
# TODO: 이거 true 면 작동 안함. 지원 한계인지 설정 문제인지는 모르겠음. <2026-11-19>
# >  {"error":{"code":"3051","message":"tools: Value error, Tool types ['custom'] are not supported; this endpoint currently supports only client-executed function tools.","param":"tools","type":"invalid_request_error"}}
code_mode = false

[mcp_servers.mdn]
url = "https://mcp.mdn.mozilla.net/"

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.nixos]
command = "uvx"
args = ["mcp-nixos"]

[marketplaces.cc-marketplace]
source_type = "git"
source = "https://github.com/kenryu42/cc-marketplace.git"

[plugins."cc-safety-net@cc-marketplace"]
enabled = true


[hooks.state]

[hooks.state."cc-safety-net@cc-marketplace:hooks/codex.json:pre_tool_use:0:0"]
trusted_hash = "sha256:5174e0a51d30e5607ceaa390f6be6d5bf3487b570b8d42fbe70b2f8b40f16aa2"
trusted_content_hash = "sha256:134335b98f9c738081b6c123cd333d7f34f824c11de2ea8574f029f5413c247e"

[projects."/home/hnjae/.local/share/dotfiles"]
trust_level = "trusted"
