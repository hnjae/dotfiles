model_provider = "openrouter"
model = "deepseek/deepseek-v4.1-flash-1017"
web_search = "disabled"
model_catalog_json = "~/.codex/model-catalogs/openrouter.json"

[model_providers.openrouter]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"

# key-name: code-agent@1password
[model_providers.openrouter.auth]
command = "op"
args = ["read", "op://Personal/h6mnkqwoqnlvd3p5pfzlwdof4a/credential"]

[tui]
screen_reader_detection_done = true
theme = "base16-256"
show_tooltips = true

[features]
# TODO: 이거 true 면 작동 안함. 지원 한계인지 설정 문제인지는 모르겠음. <2026-11-19>
# >  {"error":{"code":"3051","message":"tools: Value error, Tool types ['custom'] are not supported; this endpoint currently supports only client-executed function tools.","param":"tools","type":"invalid_request_error"}}
code_mode = false
prevent_idle_sleep = true

[shell_environment_policy]
inherit = "core"
set = { DEVENV_TUI = "false" }

[shell_environment_policy.filters]
"LD_*" = "include"
"LC_*" = "include"
"LIBEXEC_PATH" = "include"
"XDG_*" = "include"
"USER" = "include"
"TERMINFO" = "include"
"TERMINFO_DIRS" = "include"
"TERM" = "include"
"KITTY_*" = "include"
"TMUX" = "include"
"TMUX_*" = "include"
"HC_TERMINAL_*" = "include"
"DIRENV_*" = "include"
"DEVENV_*" = "include"
"AWS_*" = "exclude"
"AZURE_*" = "exclude"
"*_KEY" = "exclude"
"*_SECRET" = "exclude"
"*_PASSWORD" = "exclude"
"*KEY*" = "exclude"
"*SECRET*" = "exclude"
"*TOKEN*" = "exclude"
"*PASSWORD*" = "exclude"

[mcp_servers.mdn]
url = "https://mcp.mdn.mozilla.net/"

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.nixos]
command = "uvx"
args = ["mcp-nixos"]

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"

[marketplaces.cc-marketplace]
source_type = "git"
source = "https://github.com/kenryu42/cc-marketplace.git"
ref = "6a6b0a9f4b86d2b8230a1d06872fdd61dcace990"

[plugins."cc-safety-net@cc-marketplace"]
enabled = true

