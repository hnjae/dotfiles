# Global agent permissions.

default = "prompt"

[bash]
default = "allow"

# Blocked even under default = "allow" and YOLO. A rule matches one simple
# command: `foo *` covers `foo` and `foo <args>`, a bare `foo` covers only
# `foo`. A line the shell cannot split stays one scope, so a rule there sees
# only the beginning of the whole line.
#
# Ordered by what cannot be undone: the widest reach first.
deny = [
  # Another user, root above all: root reaches every store below without the
  # rules being asked again.
  "sudo *",
  "doas *",
  "su *",

  # Secrets. Each block names the subcommand that prints a value or hands out
  # a key; the forms that write ciphertext stay allowed.

  # sops: plaintext to stdout or an editor. Keep the list narrow, since
  # `sops *` would block the encrypt forms too.
  "sops decrypt *",
  "sops -d *",
  "sops --decrypt *",
  "sops exec-env *",
  "sops exec-file *",
  "sops edit *",

  # 1Password: read, inject, run, and export all print the value.
  "op read *",
  "op inject *",
  "op run *",
  "op item get *",
  "op document get *",
  "op export *",

  # OpenPGP: decrypt, export private keys, create or revoke a key.
  "gpg --decrypt *",
  "gpg -d *",
  "gpg --export-secret-keys *",
  "gpg --export-secret-subkeys *",
  "gpg --gen-key *",
  "gpg --gen-revoke *",

  # age: no encrypt-only split worth keeping, and sops drives it anyway.
  "age --decrypt *",
  "age -d *",
  "age-keygen *",

  # Desktop keyrings: lookup and read print the stored value.
  "secret-tool lookup *",
  "secret-tool search *",
  "kwallet-query --read-password *",
  "kwallet-query -r *",

  # The environment holds every variable at once. The bare forms are the whole
  # rule, so `env FOO=bar cmd` still runs.
  "printenv *",
  "env",
  "set",
  "export -p*",

  # Deletion that cannot be undone: a root, untracked files, or a device
  # written in place of a file.
  "rm -rf /*",
  "rm -rf ~/*",
  "rm -rf $HOME/*",
  "git clean -fdx *",
  "mkfs *",
  "dd *",

  # History that already left this machine.
  "git push --force *",
  "git push -f *",

  # A mode or an owner spread over a whole tree: undoing it needs root.
  "chmod -R 777 *",
  "chown -R *",

  # Power state: the session and everything else running ends with it.
  "shutdown *",
  "reboot *",
  "poweroff *",
  "systemctl poweroff *",
  "systemctl reboot *",

  # Fork bomb: the process table fills and nothing else can start.
  ":(){ *",
]

# Web tools prompt by default; these are the read-only lookups worth skipping.
[websearch]
allow = ["*"]

[webfetch]
default = "prompt"
allow = [
  "https://github.com/**",
  "https://maki.sh/**",
  "https://api.github.com/**",
  "https://raw.githubusercontent.com/**",
  "https://objects.githubusercontent.com/**",
  "https://developers.openai.com/**",
  "https://docs.pi.dev/**",
  "https://pypi.org/**",
]

# MCP servers: allow read-only tools, deny anything that mutates.
[mcp.exa]
default = "allow"

[mcp.context7]
default = "allow"

[mcp.mdn]
default = "allow"

[mcp.nixos]
default = "allow"
allow = ["*"]

[edit]
allow = [
  "/tmp/**",
  "~/.config/maki/**",
]

[write]
allow = [
  "/tmp/**",
  "~/.config/maki/**",
]
