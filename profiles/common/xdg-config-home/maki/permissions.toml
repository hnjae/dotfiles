# Global agent permissions.

default = "prompt"

[bash]
default = "allow"

# Blocked even under default = "allow" and YOLO.
deny = [
  # sops: decrypting the plaintext is not allowed. Keep this list narrow
  # and explicit; `sops *` would also block the encrypt forms allowed above.
  "sops decrypt *",
  "sops -d *",
  "sops --decrypt *",
  "sops exec-env *",
  "sops exec-file *",
  "sops edit *",

  # op: every path that puts a secret value in the clear.
  "op read *",
  "op inject *",
  "op run *",
  "op item get *",
  "op document get *",
  "op export *",

  # gpg: decrypting and exporting private keys.
  "gpg --decrypt *",
  "gpg -d *",
  "gpg --export-secret-keys *",
  "gpg --export-secret-subkeys *",
  "gpg --gen-key *",
  "gpg --gen-revoke *",

  # age has no encrypt-only split worth keeping, and sops drives it.
  "age --decrypt *",
  "age -d *",
  "age-keygen *",

  # libsecret and KWallet: lookup/read print the stored secret.
  "secret-tool lookup *",
  "secret-tool search *",
  "kwallet-query --read-password *",
  "kwallet-query -r *",

  # Environment dumps print every variable; bare env stays blocked while
  # `env FOO=bar cmd` keeps working.
  "printenv *",
  "env",
  "set",
  "export -p*",

  # Rootful
  "sudo *",
  "doas *",
  "su *",

  # Might delete files:
  "rm -rf /*",
  "rm -rf ~/*",
  "rm -rf $HOME/*",
  "git push --force *",
  "git push -f *",
  "git clean -fdx *",
  "mkfs *",
  "dd *",

  # System shutdown
  "shutdown *",
  "reboot *",
  "poweroff *",
  "systemctl poweroff *",
  "systemctl reboot *",

  # Mods files
  "chmod -R 777 *",
  "chown -R *",

  ":(){ *",

  # very local
  "ssh admin@",
  "ssh hnjae@",
]

# Web tools prompt by default; these are the read-only lookups worth skipping.
[websearch]
allow = ["*"]

[webfetch]
default = "prompt"
allow = [
  "https://github.com/**",
  "https://maki.sh/**",
  "https://api.github.com/**",
  "https://raw.githubusercontent.com/**",
  "https://objects.githubusercontent.com/**",
]

# MCP servers: allow read-only tools, deny anything that mutates.
[mcp.exa]
default = "allow"

[mcp.context7]
default = "allow"

[mcp.mdn]
default = "allow"

[mcp.nixos]
default = "allow"

[edit]
allow = [
  "/tmp/**",
  "~/.config/maki/**",
]

[write]
allow = [
  "/tmp/**",
  "~/.config/maki/**",
]
