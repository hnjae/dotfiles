# Global agent permissions.
#
# bash runs anything without a prompt; only the deny list stops a command.
# A deny beats every allow, the default, and YOLO mode, so keep it narrow
# and explicit rather than broad.
#
# Patterns: `cmd *` matches bare `cmd` and `cmd` + args. Path scopes use
# `dir/**`. Commands split by `&&`, `;`, `|` are checked individually.
#
# Not covered here on purpose: `$(...)`, backticks, `(...)` and `$((...))`
# always prompt regardless of these rules. Secrets are also guarded outside
# this file, by the secrets_guard plugin, which blocks secret paths for every
# tool rather than only bash.

[bash]
# Every command runs without a prompt. The deny list below is what stays
# blocked, so keep it narrow and explicit: a deny beats everything,
# including this default and YOLO mode.
default = "allow"
allow = true

# Blocked even under default = "allow" and YOLO.
deny = [
  # sops: decrypting the plaintext is not allowed. Keep this list narrow
  # and explicit; `sops *` would also block the encrypt forms allowed above.
  "sops decrypt *",
  "sops -d *",
  "sops --decrypt *",
  "sops exec-env *",
  "sops exec-file *",
  "sops edit *",
  # op: every path that puts a secret value in the clear.
  "op read *",
  "op inject *",
  "op run *",
  "op item get *",
  "op document get *",
  "op export *",
  # gpg: decrypting and exporting private keys.
  "gpg --decrypt *",
  "gpg -d *",
  "gpg --export-secret-keys *",
  "gpg --export-secret-subkeys *",
  "gpg --gen-key *",
  "gpg --gen-revoke *",
  # age has no encrypt-only split worth keeping, and sops drives it.
  "age --decrypt *",
  "age -d *",
  "age-keygen *",
  # libsecret and KWallet: lookup/read print the stored secret.
  "secret-tool lookup *",
  "secret-tool search *",
  "kwallet-query --read-password *",
  "kwallet-query -r *",
  "sudo *",
  "doas *",
  "su *",
  "rm -rf /*",
  "rm -rf ~/*",
  "rm -rf $HOME/*",
  "git push --force *",
  "git push -f *",
  "git clean -fdx *",
  "mkfs *",
  "dd *",
  "shutdown *",
  "reboot *",
  "poweroff *",
  "systemctl poweroff *",
  "systemctl reboot *",
  "chmod -R 777 *",
  "chown -R *",
  ":(){ *",
]

# Web tools prompt by default; these are the read-only lookups worth skipping.
[websearch]
allow = ["*"]

[webfetch]
allow = ["*"]

# MCP servers: allow read-only tools, deny anything that mutates.
[mcp.context7]
default = "allow"

[mcp.mdn]
default = "allow"

[mcp.nixos]
default = "allow"

[mcp.kagi]
default = "allow"
