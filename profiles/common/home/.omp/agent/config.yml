---
symbolPreset: nerd
theme:
  dark: dark-gruvbox
  light: light-gruvbox
setupVersion: 2
composer:
  shape: pi
  tokenRate: true
modelRoles:
  default: openai-codex/gpt-6-luna:max
  plan: openai-codex/gpt-6.1-sol:high
  commit: openai-codex/gpt-6-luna:low
  tiny: openai-codex/gpt-6-luna:low
  smol: openai-codex/gpt-6-luna:high
  slow: openai-codex/gpt-6.1-luna:max
  task: openai-codex/gpt-6-luna:auto
  # vision: openai-codex/gpt-6-luna:auto
hideThinkingBlock: false
statusLine:
  preset: default
  contextLine: embedded
  transparent: true
security:
  enabled: true
tui:
  textSizing: true
  imeSafeCursor: false
  codexResetFireworks: false
  tight: false
display:
  showTokenUsage: true
  showTurnTime: true
  smoothStreaming: true
  pinnedAgents: full
  cacheMissMarker: true
proseOnlyThinking: true
astGrep:
  enabled: true
dev:
  autoqaConsent: granted
# retry:
#   fallbackChains:
#     openai-codex/gpt-6-sol:
#       - openrouter/z-ai/xiaomi/mimo-v2.6-pro:high
#     openai-codex/gpt-6-luna:
#       - openrouter/~deepseek/deepseek-flash-latest:high
task:
  showResolvedModelBadge: true
