symbolPreset: nerd
theme:
  dark: dark-gruvbox
  light: light-gruvbox
setupVersion: 2
modelRoles:
  default: opencode-go/deepseek-v4.1-flash:high
  slow: opencode-go/muse-spark-1.3-contributor:high
  task: opencode-go/muse-spark-1.3-contributor:high
  plan: opencode-go/deepseek-v4.1-flash:high
  memory: opencode-go/deepseek-v4.1-flash:high
  designer: opencode-go/deepseek-v4.1-flash:high
  vision: opencode-go/deepseek-v4.1-flash:high
  smol: opencode-go/deepseek-v4.1-flash:low
  tiny: opencode-go/deepseek-v4.1-flash:low
  commit: opencode-go/deepseek-v4.1-flash:low
  judge: opencode-go/deepseek-v4.1-flash:low
  widget: opencode-go/deepseek-v4.1-flash:low
  web: web/exa
tui:
  textSizing: true
  vimMode: true
  vimModeDisplay: text
  tight: true
  mouse: false
  resizeScrollback: rebuild
  completeScrollback: true
display:
  showTokenUsage: true
  cacheMissMarker: true
  shimmer: kitt
  smoothStreaming: false
  subagentLivePreview: true
  hideToolActivity: false
  showTurnTime: false
  collapseCompacted: true
astGrep:
  enabled: true
secrets:
  enabled: true
personality: none
advisor:
  enabled: false
hideThinkingBlock: false
composer:
  shape: rail
  tokenRate: false
statusLine:
  preset: default
  contextLine: embedded
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
  showHookStatus: true
images:
  blockImages: false
bash:
  enabled: true
  allowCompoundCommands: true
followUpMode: one-at-a-time
interruptMode: immediate
power:
  sleepPrevention: idle
compaction:
  idleEnabled: true
  idleTimeoutSeconds: 3600
edit:
  mode: hashline
generate_image:
  enabled: false
textVerbosity: low
error:
  notify: "on"
retry:
  fallbackChains:
    opencode-go/deepseek-v4.1-flash:
      - opencode-go/deepseek-v4.1-flash
task:
  enableEffort: false